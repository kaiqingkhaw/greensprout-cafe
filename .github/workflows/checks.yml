name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript, asset and frontend regression checks
        run: npm test
      - name: PHP syntax
        run: find . -name '*.php' -not -path './public/uploads/*' -print0 | xargs -0 -n1 php -l
      - name: Bundled product photographs
        run: php tests/product-media.php
